<!DOCTYPE html>
<html lang="en">
<head>

<body>

            </tr>

            <tr>
                <th>4</th>
                <td><input type="number" name = "num4" step="any" id="n4" placeholder="0" required></td>
            </tr>

            <tr>
                <th>5</th>
                <td><input type="number" name = "num5" step="any" id="n5" placeholder="0" required></td>
            </tr>

            <tr>

            <tr>

            </tr>

            <tr>

            </tr>

            <tr>
                <th>11</th>
                <td><input type="number" name = "num11" step="any" id="n11" placeholder="0" required></td>
            </tr>

            <tr>
                <th><input type="reset"></th>
                <th><input type="button" onclick="sumValues()" value="Найти"></th>
            </tr>

            <tr>
                <th>Ответ:</th>
                <th><input type= "text" maxlength="70" name="answer" id = "result" placeholder="NaN" readonly></th>

        </table>
    </form>
</div>
